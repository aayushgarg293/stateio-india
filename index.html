<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Stateio India</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg:#d2d2d2;
  --ink:#2b2f33;
  --blue:#2e9bf0;  --blue-d:#1b6fb8;
  --red:#e8352b;
  --green:#4fd858;
  --gray:#9a9a9a;
}

body {
  background:var(--bg);
  font-family:'Fredoka','Baloo 2','Nunito',ui-rounded,'SF Pro Rounded','Arial Rounded MT Bold',system-ui,sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  height:100vh;
  overflow:hidden;
  color:var(--ink);
}

#top-ui {
  width:100%;
  padding:14px 16px 6px;
  flex-shrink:0;
  display:flex;
  justify-content:center;
}
/* Thick white-rimmed pill showing each side's share of all troops */
#progress-bar {
  width:min(560px,86%);
  height:26px;
  background:#fff;
  border:3px solid #fff;
  border-radius:999px;
  overflow:hidden;
  display:flex;
  gap:3px;
  box-shadow:0 2px 0 rgba(0,0,0,0.12);
}
.pb-seg {
  height:100%;
  transition:width .4s cubic-bezier(.4,0,.2,1);
  min-width:0;
}

#map-wrapper {
  position:relative;
  flex:1;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
#game-svg {
  max-width:100%;
  max-height:100%;
  display:block;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

/* Flat states with thin pale borders; the fill colour is set from JS and
   deepens with the troop count */
.state {
  cursor:pointer;
  stroke:#e4e4e4;
  stroke-width:0.9;
  stroke-linejoin:round;
  transition:fill .25s, filter .12s;
}
.state:hover { filter:brightness(1.05); }
.state.sel, .state.drag-on {
  stroke:#fff;
  stroke-width:2.6;
  filter:brightness(1.06);
}
.state.drag-tgt {
  stroke:#fff;
  stroke-width:2.2;
}
/* Regions drawn for completeness but not part of the game (small UTs, islands) */
.inert {
  fill:#bcbcbc;
  stroke:#d6d6d6;
  stroke-width:0.6;
  pointer-events:none;
}

.abbr {
  font-size:5.5px;
  font-weight:600;
  fill:rgba(0,0,0,0.38);
  text-anchor:middle;
  dominant-baseline:central;
  pointer-events:none;
  letter-spacing:.3px;
}
.tnum {
  font-size:9px;
  font-weight:700;
  fill:#1f2326;
  text-anchor:middle;
  dominant-baseline:central;
  pointer-events:none;
}
/* Owner emblem inside the centre circle */
.icn {
  font-size:8.5px;
  fill:#fff;
  text-anchor:middle;
  dominant-baseline:central;
  pointer-events:none;
}

/* Centre circle of each state — troops leave from it and arrive at it */
.node {
  stroke:rgba(255,255,255,0);
  stroke-width:0;
  pointer-events:none;
  transition:fill .25s;
}
/* Soft halo: blue around the state being dragged from, red around the target */
.node.sel, .node.src {
  stroke:rgba(60,110,230,0.4);
  stroke-width:7;
}
.node.tgt {
  stroke:rgba(235,70,60,0.45);
  stroke-width:7;
}

/* Aiming arrow, dragged from one state's circle to another's */
#arrow { pointer-events:none; }
#arrow-line {
  stroke:rgba(74,108,224,0.72);
  stroke-width:6;
  stroke-linecap:round;
}
#arrow-head { fill:rgba(74,108,224,0.9); }

#fx {
  position:absolute;
  pointer-events:none;
}

.overlay {
  position:fixed;
  inset:0;
  background:rgba(210,210,210,0.88);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:300;
  backdrop-filter:blur(6px);
}
.card {
  background:#fff;
  border-radius:28px;
  padding:34px 38px 30px;
  max-width:400px;
  width:90%;
  text-align:center;
  box-shadow:0 10px 0 rgba(0,0,0,0.13);
}
.card h1 {
  font-size:clamp(2.4rem,9vw,3.4rem);
  font-weight:700;
  letter-spacing:1px;
  line-height:1.05;
  margin-bottom:4px;
  color:var(--blue);
  text-shadow:0 4px 0 var(--blue-d);
}
.sub {
  font-size:12px;
  font-weight:600;
  letter-spacing:4px;
  color:#a3a8ad;
  margin-bottom:18px;
  text-transform:uppercase;
}
.desc {
  font-size:15px;
  font-weight:500;
  line-height:1.6;
  color:#5a6066;
  margin-bottom:20px;
}
.legend {
  display:flex;
  justify-content:center;
  gap:14px;
  flex-wrap:wrap;
  margin-bottom:26px;
}
.li {
  display:flex;
  align-items:center;
  gap:6px;
  font-size:13px;
  font-weight:600;
  color:#5a6066;
}
.ldot {
  width:14px; height:14px;
  border-radius:50%;
  flex-shrink:0;
}
/* Chunky button that visibly presses down */
.btn {
  background:var(--blue);
  color:#fff;
  border:none;
  border-radius:18px;
  padding:14px 52px;
  font-family:inherit;
  font-size:20px;
  font-weight:700;
  letter-spacing:1.5px;
  cursor:pointer;
  box-shadow:0 6px 0 var(--blue-d);
  transition:transform .08s, box-shadow .08s, filter .12s;
  text-transform:uppercase;
}
.btn:hover  { filter:brightness(1.07); }
.btn:active { transform:translateY(4px); box-shadow:0 2px 0 var(--blue-d); }
.bigicon { font-size:64px; display:block; margin-bottom:6px; }
.card h1.win  { color:#ffb800; text-shadow:0 4px 0 #c98600; }
.card h1.lose { color:var(--red); text-shadow:0 4px 0 #a31d16; }
#res-msg { color:#5a6066; font-size:15px; font-weight:500; margin:10px 0 24px; line-height:1.5; }
.tip { margin-top:16px; font-size:12px; font-weight:500; color:#b0b5ba; }

#hint {
  position:fixed;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  background:#fff;
  color:#5a6066;
  font-size:13px;
  font-weight:600;
  padding:6px 18px;
  border-radius:999px;
  box-shadow:0 3px 0 rgba(0,0,0,0.12);
  pointer-events:none;
  z-index:10;
  transition:opacity .3s;
  white-space:nowrap;
}

.spinner {
  width:40px; height:40px;
  border:4px solid #dfe9f3;
  border-top-color:var(--blue);
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:0 auto 18px;
}
@keyframes spin { to { transform:rotate(360deg); } }
#load-label { font-size:14px; font-weight:600; letter-spacing:2px; color:#8a9096; margin-bottom:8px; }
#load-err   { display:none; color:var(--red); font-size:13px; margin-top:14px; line-height:1.6; }
</style>
</head>
<body>

<div id="top-ui">
  <div id="progress-bar">
    <div class="pb-seg" id="pb-blue"  style="background:#2e9bf0;width:0%"></div>
    <div class="pb-seg" id="pb-red"   style="background:#e8352b;width:0%"></div>
    <div class="pb-seg" id="pb-green" style="background:#4fd858;width:0%"></div>
    <div class="pb-seg" id="pb-gray"  style="background:#9a9a9a;width:100%"></div>
  </div>
</div>

<div id="map-wrapper">
<svg id="game-svg" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
<g id="statelayer"></g>
<g id="lblayer"></g>
<g id="arrow" style="display:none"><line id="arrow-line"/><polygon id="arrow-head"/></g>
</svg>
<canvas id="fx"></canvas>
</div>

<div id="hint" style="opacity:0">Drag from your blue state to send all troops</div>

<!-- LOADING -->
<div class="overlay" id="load-scr">
  <div class="card">
    <div class="spinner"></div>
    <div id="load-label">LOADING INDIA MAP…</div>
    <div id="load-err"></div>
  </div>
</div>

<!-- START -->
<div class="overlay" id="start-scr" style="display:none">
  <div class="card">
    <h1 style="margin-bottom:16px">Stateio India</h1>
    <div class="desc">
      Drag an arrow from your <strong style="color:#2e9bf0">blue</strong> state's circle<br>
      to another circle to send your troops.
    </div>
    <div class="legend">
      <div class="li"><div class="ldot" style="background:#2e9bf0"></div>You</div>
      <div class="li"><div class="ldot" style="background:#e8352b"></div>Red</div>
      <div class="li"><div class="ldot" style="background:#4fd858"></div>Green</div>
      <div class="li"><div class="ldot" style="background:#9a9a9a"></div>Neutral</div>
    </div>
    <button class="btn" id="start-btn">Play</button>
    <div class="tip">Conquer every rival state to win</div>
  </div>
</div>

<!-- RESULT -->
<div class="overlay" id="res-scr" style="display:none">
  <div class="card">
    <span class="bigicon" id="res-icon"></span>
    <h1 id="res-title"></h1>
    <p id="res-msg"></p>
    <button class="btn" id="restart-btn">Play again</button>
  </div>
</div>

<script>
'use strict';

// ══════════════════════════════════════════════════════
//  CONSTANTS
// ══════════════════════════════════════════════════════

// Playable territories (exactly the ones the game logic supports)
const VALID_STATES = new Set([
  'Andhra Pradesh','Arunachal Pradesh','Assam','Bihar','Chhattisgarh',
  'Goa','Gujarat','Haryana','Himachal Pradesh','Jharkhand','Karnataka',
  'Kerala','Madhya Pradesh','Maharashtra','Manipur','Meghalaya',
  'Mizoram','Nagaland','Odisha','Punjab','Rajasthan','Sikkim',
  'Tamil Nadu','Telangana','Tripura','Uttar Pradesh','Uttarakhand',
  'West Bengal','Jammu & Kashmir','Ladakh'
]);

// Map any spelling/name variant that appears in the provided in.svg (or GeoJSON)
// to our canonical game name. Return null to exclude (small UTs, islands, etc).
const NORMALIZE = {
  // old spellings from the SVG
  'Orissa': 'Odisha',
  'Uttaranchal': 'Uttarakhand',
  'Chhattishgarh': 'Chhattisgarh',

  // exact strings from in.svg (with accents / "and" variations)
  'Jammu and Kashmir': 'Jammu & Kashmir',
  'Dādra and Nagar Haveli and Damān and Diu': null,
  'Dadra and Nagar Haveli and Daman and Diu': null,
  'Andaman and Nicobar': null,

  // common exclusions (small UTs + islands we do not play)
  'Andaman & Nicobar Island': null,
  'Chandigarh': null,
  'Delhi': null,
  'NCT of Delhi': null,
  'Lakshadweep': null,
  'Pondicherry': null,
  'Puducherry': null,
  'Dadra & Nagar Haveli': null,
  'Daman & Diu': null,
  'Daman and Diu': null,
};

const SHORT = {
  'Andhra Pradesh':'AP','Arunachal Pradesh':'AR','Assam':'AS',
  'Bihar':'BR','Chhattisgarh':'CG','Goa':'GA','Gujarat':'GJ',
  'Haryana':'HR','Himachal Pradesh':'HP','Jharkhand':'JH',
  'Karnataka':'KA','Kerala':'KL','Madhya Pradesh':'MP',
  'Maharashtra':'MH','Manipur':'MN','Meghalaya':'ML',
  'Mizoram':'MZ','Nagaland':'NL','Odisha':'OD','Punjab':'PB',
  'Rajasthan':'RJ','Sikkim':'SK','Tamil Nadu':'TN',
  'Telangana':'TG','Tripura':'TR','Uttar Pradesh':'UP',
  'Uttarakhand':'UK','West Bengal':'WB',
  'Jammu & Kashmir':'JK','Ladakh':'LA'
};

const OC = {
  blue:'#2e9bf0', red:'#e8352b', green:'#4fd858', neutral:'#9a9a9a'
};

// A state's fill runs from a pale tint when it is nearly empty to the full
// owner colour once it holds FULL_AT troops
const PALE    = { blue:'#c4e2fa', red:'#f6b9b3', green:'#c3f1c5' };
const FULL_AT = 40;

function hexRgb(h) {
  return [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
}
const SHADE = {};
['blue', 'red', 'green'].forEach(o => { SHADE[o] = [hexRgb(PALE[o]), hexRgb(OC[o])]; });

function shade(owner, troops) {
  if (owner === 'neutral') return OC.neutral;
  const k = Math.max(0, Math.min(1, troops / FULL_AT));
  const [a, b] = SHADE[owner];
  return 'rgb(' + a.map((v, i) => Math.round(v + (b[i] - v) * k)).join(',') + ')';
}

// Emblem shown inside each owner's centre circles
const EMBLEM = { blue:'\u2605', red:'\u25C6', green:'\u269C\uFE0E' };

const BLUE_START  = ['Punjab','Haryana','Uttarakhand'];
const RED_START   = ['Arunachal Pradesh','Assam','Nagaland'];
const GREEN_START = ['Tamil Nadu','Kerala','Karnataka'];

// ══════════════════════════════════════════════════════
//  DYNAMIC MAPS (populated from in.svg)
// ══════════════════════════════════════════════════════

let CX       = {};   // name → [cx, cy]  using the exact label points from the provided SVG
let ID2NAME  = {};   // svg-element-id → state name
let NAME2ID  = {};   // state name → svg-element-id

// ══════════════════════════════════════════════════════
//  GAME STATE
// ══════════════════════════════════════════════════════

let T        = {};   // name → { owner, troops }
let units    = [];   // troops on the march
let emitters = [];   // marches still leaving their state
let puffs    = [];   // smoke where enemy units met
let dirty    = false; // state changed this frame → re-render once
let running  = false;
let raf      = null;
let lastTs   = 0, lastTroop = 0, lastAI = 0;

const svg        = document.getElementById('game-svg');
const statelayer = document.getElementById('statelayer');
const lblayer    = document.getElementById('lblayer');
const wrapEl     = document.getElementById('map-wrapper');
const fx         = document.getElementById('fx');
const ctx        = fx.getContext('2d');
let fxKey        = '';
const arrowEl    = document.getElementById('arrow');
const arrowLine  = document.getElementById('arrow-line');
const arrowHead  = document.getElementById('arrow-head');
const hintEl     = document.getElementById('hint');

const elT = {};     // name → troop <text>
const elI = {};     // name → icon  <text>
const elN = {};     // name → centre <circle>

let dragSrc  = null;
let dragTgt  = null;
let selState = null;

// Troop units: one dot per troop, marching in rows at one constant speed
const WORLD_SPEED = 40;                     // SVG units per second
const UNIT_R      = 2.2;                     // dot radius
const UNIT_GAP    = 5.5;                     // spacing within a row and between rows
const ROW_WIDTH   = 4;                       // dots per row
const ROW_TIME    = UNIT_GAP / WORLD_SPEED;  // seconds between rows leaving a state
const FUNNEL      = 16;                      // distance over which a column fans out / closes in
const HIT_R       = 4.5;                     // enemy dots closer than this cancel out
const PUFF_LIFE   = 0.5;                     // seconds a smoke puff lasts

// Centre circles: radius, touch distance, and a darker shade of each owner's colour
const NODE_R   = 7;
const NODE_HIT = NODE_R + 4;   // how close the arrow tip must get to count as touching
const NC = { blue:'#24598c', red:'#8f1711', green:'#1d7a27', neutral:'#ffffff' };

// Dot colours — the same dark shades as the centre circles
const UC = { blue:'#24598c', red:'#8f1711', green:'#1d7a27' };

// How often each AI thinks (ms), and how many of its states may attack alone per turn
const AI_INTERVAL    = 3000;
const AI_MAX_SOURCES = 1;
// Chance per turn that an AI also tries a pooled strike on a strong territory
const AI_POOL_CHANCE = 0.3;

// ══════════════════════════════════════════════════════
//  MAP LOADING — use the EXACT paths + label positions from in.svg
//  This makes the map visually identical to the SVG you provided.
// ══════════════════════════════════════════════════════

function normalizeName(raw) {
  if (!raw) return null;
  if (Object.prototype.hasOwnProperty.call(NORMALIZE, raw)) {
    return NORMALIZE[raw];
  }
  return raw;
}

// <-- will be filled by the build step for standalone version

async function loadMap() {
  try {
    let svgText;

    if (typeof MAP_SVG_TEXT === 'string' && MAP_SVG_TEXT.length > 5000) {
      // Standalone single-file mode (inlined data)
      svgText = MAP_SVG_TEXT;
    } else {
      // Development mode: load external in.svg (needs local server)
      const res = await fetch('in.svg');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      svgText = await res.text();
    }

    const parser = new DOMParser();
    const doc = parser.parseFromString(svgText, 'image/svg+xml');

    const featuresG = doc.querySelector('#features');
    const labelsG   = doc.querySelector('#label_points');

    if (!featuresG) throw new Error('Could not find #features in in.svg');

    // 1. Inject the *exact* <path> elements from your in.svg so the map is visually identical.
    //    We draw every named region the SVG contains (including small islands/UTs as background).
    //    Only the ones in VALID_STATES become playable with troops/labels.
    featuresG.querySelectorAll('path').forEach(origPath => {
      const rawName = origPath.getAttribute('name');
      if (!rawName) return;

      const norm = normalizeName(rawName) || rawName; // use raw if we don't normalize it away
      const id = 'st-' + norm.replace(/[\s&,./]+/g, '-').toLowerCase();

      const el = origPath.cloneNode(true);
      el.setAttribute('id', id);
      el.setAttribute('data-name', norm);
      el.setAttribute('class', 'state');

      // Let our renderAll control the fill
      el.removeAttribute('fill');
      el.removeAttribute('stroke');

      statelayer.appendChild(el);

      // Only set up interaction/centers for states the game actually plays
      const playable = normalizeName(rawName);
      if (playable && VALID_STATES.has(playable)) {
        ID2NAME[id]   = playable;
        NAME2ID[playable] = id;
      } else {
        el.setAttribute('class', 'inert');
      }
    });

    // 2. Use the exact pre-placed label centers that come with your SVG.
    //    These positions were chosen by the map author for this specific drawing.
    if (labelsG) {
      labelsG.querySelectorAll('circle').forEach(c => {
        const raw = c.getAttribute('class');
        if (!raw || /^\d/.test(raw)) return;

        const playable = normalizeName(raw);
        if (playable && VALID_STATES.has(playable) && !CX[playable]) {
          const cx = parseFloat(c.getAttribute('cx'));
          const cy = parseFloat(c.getAttribute('cy'));
          if (!isNaN(cx) && !isNaN(cy)) {
            CX[playable] = [cx, cy];
          }
        }
      });
    }

    // Fallback: if some centers are missing, derive rough ones from path bbox (rare)
    // (we keep it simple — the label_points in your SVG cover the important ones)

    if (Object.keys(CX).length < 5) {
      throw new Error('Very few centers found from in.svg label_points');
    }

    // Make sure every path we pulled from your SVG has a visible fill.
    // Playable states will be recolored correctly by renderAll() after initGame.
    statelayer.querySelectorAll('path.state').forEach(el => {
      if (!el.getAttribute('fill')) {
        el.setAttribute('fill', OC.neutral);
      }
    });

    // Hand off to the start screen
    document.getElementById('load-scr').style.display  = 'none';
    document.getElementById('start-scr').style.display = 'flex';

  } catch (e) {
    console.error('Failed to load map:', e);
    const err = document.getElementById('load-err');
    err.style.display = 'block';
    err.innerHTML =
      'Failed to load the embedded India map.<br>' +
      'Something went wrong while parsing the inlined SVG data.';
    document.querySelector('.spinner').style.display = 'none';
  }
}

//  GAME INIT
// ══════════════════════════════════════════════════════

function initGame() {
  T        = {};
  units = []; emitters = []; puffs = [];
  dirty = true;
  hideArrow();
  dragSrc = dragTgt = selState = null;

  Object.keys(CX).forEach(name => {
    let owner = 'neutral';
    if (BLUE_START.includes(name))  owner = 'blue';
    if (RED_START.includes(name))   owner = 'red';
    if (GREEN_START.includes(name)) owner = 'green';
    T[name] = {
      owner,
      troops: owner === 'neutral' ? 3 + Math.floor(Math.random() * 7) : 12
    };
  });

  buildLabels();
  renderAll();
  updatePB();
}

function buildLabels() {
  lblayer.innerHTML = '';
  // Clear cached references so they get rebuilt
  Object.keys(elT).forEach(k => delete elT[k]);
  Object.keys(elI).forEach(k => delete elI[k]);
  Object.keys(elN).forEach(k => delete elN[k]);

  Object.keys(CX).forEach(name => {
    const [cx, cy] = CX[name];

    const node = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    node.setAttribute('cx', cx);
    node.setAttribute('cy', cy);
    node.setAttribute('r', NODE_R);
    node.setAttribute('class', 'node');
    lblayer.appendChild(node);
    elN[name] = node;

    lblayer.appendChild(mkTxt(cx, cy - NODE_R - 5, 'abbr', SHORT[name] || name.slice(0, 4)));

    const icon = mkTxt(cx, cy + 0.5, 'icn', '');
    icon.setAttribute('display', 'none');
    lblayer.appendChild(icon);
    elI[name] = icon;

    const tc = mkTxt(cx, cy + NODE_R + 7, 'tnum', '');
    lblayer.appendChild(tc);
    elT[name] = tc;
  });
}

function mkTxt(x, y, cls, txt) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  el.setAttribute('x', x);
  el.setAttribute('y', y);
  el.setAttribute('class', cls);
  el.textContent = txt;
  return el;
}

// ══════════════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════════════

function renderAll() {
  Object.entries(T).forEach(([nm, t]) => {
    const sid = NAME2ID[nm];
    const el  = sid ? document.getElementById(sid) : null;
    if (el) {
      el.setAttribute('fill', shade(t.owner, t.troops));
      let cls = 'state';
      if (t.owner !== 'neutral') cls += ' owned';
      if (nm === selState)       cls += ' sel';
      if (nm === dragSrc)        cls += ' drag-on';
      if (nm === dragTgt)        cls += ' drag-tgt';
      el.setAttribute('class', cls);
    }

    const node = elN[nm];
    if (node) {
      node.setAttribute('fill', NC[t.owner]);
      let cls = 'node';
      if (nm === selState) cls += ' sel';
      if (nm === dragSrc)  cls += ' src';
      if (nm === dragTgt)  cls += ' tgt';
      node.setAttribute('class', cls);
    }

    if (elT[nm]) elT[nm].textContent = Math.floor(t.troops);

    const ic = elI[nm];
    if (ic) {
      ic.textContent = EMBLEM[t.owner] || '';
      ic.setAttribute('display', t.owner === 'neutral' ? 'none' : '');
    }
  });
}

// Top bar: each side's share of all troops, counting those on the march
function updatePB() {
  const c = { blue:0, red:0, green:0, neutral:0 };
  Object.values(T).forEach(t => { c[t.owner] += t.troops; });
  units.forEach(u => { if (!u.dead) c[u.owner]++; });
  const total = c.blue + c.red + c.green + c.neutral || 1;
  ['blue','red','green','neutral'].forEach(o => {
    const pid = o === 'neutral' ? 'pb-gray' : 'pb-' + o;
    const el  = document.getElementById(pid);
    if (!el) return;
    el.style.width   = (c[o] / total * 100).toFixed(1) + '%';
    el.style.display = c[o] > 0 ? '' : 'none';
  });
}

// ══════════════════════════════════════════════════════
//  TROOP UNITS — every dot is one real troop
// ══════════════════════════════════════════════════════

function flightLen(from, to) {
  const [x1, y1] = CX[from];
  const [x2, y2] = CX[to];
  return Math.hypot(x2 - x1, y2 - y1) || 1;
}

// Start a march: every troop currently in `from` walks out towards `to`,
// one row at a time. A new order from the same state replaces the old one.
function launch(from, to, owner) {
  if (!T[from] || !T[to] || from === to || T[from].owner !== owner) return 0;
  const count = Math.floor(T[from].troops);
  if (count <= 0) return 0;
  const [x1, y1] = CX[from];
  const [x2, y2] = CX[to];
  const len = flightLen(from, to);
  emitters = emitters.filter(e => e.from !== from);
  emitters.push({
    from, to, owner, left: count, acc: ROW_TIME,
    x1, y1, len, dx: (x2 - x1) / len, dy: (y2 - y1) / len
  });
  return count;
}

function stepEmitters(dt) {
  emitters = emitters.filter(e => {
    const src = T[e.from];
    if (src.owner !== e.owner) return false;   // state fell — the march is over
    e.acc += dt / 1000;
    while (e.acc >= ROW_TIME && e.left > 0) {
      e.acc -= ROW_TIME;
      const n = Math.min(ROW_WIDTH, e.left, Math.floor(src.troops));
      if (n <= 0) return false;
      for (let i = 0; i < n; i++) {
        units.push({
          owner: e.owner, to: e.to,
          x1: e.x1, y1: e.y1, dx: e.dx, dy: e.dy, len: e.len,
          s: e.acc * WORLD_SPEED,
          lat: (i - (n - 1) / 2) * UNIT_GAP + (Math.random() - 0.5),
          x: e.x1, y: e.y1, dead: false
        });
      }
      src.troops -= n;
      e.left     -= n;
      dirty = true;
    }
    return e.left > 0;
  });
}

function stepUnits(dt) {
  // Same speed for every unit, so far targets simply take longer to reach
  const step = WORLD_SPEED * dt / 1000;
  for (const u of units) {
    u.s += step;
    if (u.s >= u.len) { u.dead = true; arrive(u.to, u.owner); continue; }
    // Columns fan out after leaving a state and close in before the next
    const k = Math.min(1, u.s / FUNNEL, (u.len - u.s) / FUNNEL) * u.lat;
    u.x = u.x1 + u.dx * u.s - u.dy * k;
    u.y = u.y1 + u.dy * u.s + u.dx * k;
  }
  collide();
  units = units.filter(u => !u.dead);
}

// Enemy units that meet on the way cancel each other out, one for one
function collide() {
  const CELL = HIT_R + 1;
  const R2   = HIT_R * HIT_R;
  const grid = new Map();
  for (const u of units) {
    if (u.dead) continue;
    const gx = Math.floor(u.x / CELL), gy = Math.floor(u.y / CELL);
    let hit = null;
    for (let ox = -1; ox <= 1 && !hit; ox++) {
      for (let oy = -1; oy <= 1 && !hit; oy++) {
        const cell = grid.get((gx + ox) * 4096 + gy + oy);
        if (!cell) continue;
        for (const v of cell) {
          if (v.dead || v.owner === u.owner) continue;
          const ex = v.x - u.x, ey = v.y - u.y;
          if (ex * ex + ey * ey <= R2) { hit = v; break; }
        }
      }
    }
    if (hit) {
      u.dead = hit.dead = true;
      puff((u.x + hit.x) / 2, (u.y + hit.y) / 2);
      dirty = true;
      continue;
    }
    const key  = gx * 4096 + gy;
    const cell = grid.get(key);
    if (cell) cell.push(u); else grid.set(key, [u]);
  }
}

// ── Smoke ─────────────────────────────────────────────

function puff(x, y) {
  if (puffs.length >= 250) return;
  const blobs = [];
  for (let i = 0; i < 3; i++) {
    const a = Math.random() * Math.PI * 2;
    blobs.push([Math.cos(a) * 3, Math.sin(a) * 3, 2 + Math.random() * 1.5]);
  }
  puffs.push({ x, y, t: 0, blobs });
}

function stepPuffs(dt) {
  for (const p of puffs) p.t += dt / 1000;
  puffs = puffs.filter(p => p.t < PUFF_LIFE);
}

// ── Drawing (canvas laid exactly over the SVG map) ────

function syncCanvas() {
  const r   = svg.getBoundingClientRect();
  const w   = wrapEl.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const key = [r.left - w.left, r.top - w.top, r.width, r.height, dpr].join(',');
  if (key !== fxKey) {
    fxKey = key;
    fx.width  = Math.max(1, Math.round(r.width  * dpr));
    fx.height = Math.max(1, Math.round(r.height * dpr));
    fx.style.left   = (r.left - w.left) + 'px';
    fx.style.top    = (r.top  - w.top)  + 'px';
    fx.style.width  = r.width  + 'px';
    fx.style.height = r.height + 'px';
  }
  // SVG user units → canvas pixels
  const m = svg.getScreenCTM();
  ctx.setTransform(m.a * dpr, 0, 0, m.d * dpr, (m.e - r.left) * dpr, (m.f - r.top) * dpr);
}

function drawFx() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, fx.width, fx.height);
  syncCanvas();

  const TAU = Math.PI * 2;
  const dots = (r, pick) => {
    ctx.beginPath();
    for (const u of units) {
      if (pick && u.owner !== pick) continue;
      ctx.moveTo(u.x + r, u.y);
      ctx.arc(u.x, u.y, r, 0, TAU);
    }
    ctx.fill();
  };
  ['blue', 'red', 'green'].forEach(o => { ctx.fillStyle = UC[o]; dots(UNIT_R, o); });

  ctx.fillStyle = '#ffffff';
  for (const p of puffs) {
    const k = p.t / PUFF_LIFE;
    ctx.globalAlpha = (1 - k) * 0.75;
    ctx.beginPath();
    for (const [ox, oy, r] of p.blobs) {
      const bx = p.x + ox * (0.3 + k), by = p.y + oy * (0.3 + k) - k * 3;
      const br = r * (0.6 + k * 1.4);
      ctx.moveTo(bx + br, by);
      ctx.arc(bx, by, br, 0, TAU);
    }
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}


// ══════════════════════════════════════════════════════
//  COMBAT
// ══════════════════════════════════════════════════════

// One unit reaches a state: reinforce it, wear it down, or take it
function arrive(to, owner) {
  const tgt = T[to];
  if (tgt.owner === owner) {
    tgt.troops += 1;
  } else if (tgt.troops >= 1) {
    tgt.troops -= 1;
  } else {
    tgt.owner  = owner;
    tgt.troops = 1;
    // A captured state is no longer ours to command
    if (selState === to) selState = null;
    if (dragSrc === to) { dragSrc = dragTgt = null; hideArrow(); }
  }
  dirty = true;
}

// ══════════════════════════════════════════════════════
//  WIN / LOSE
// ══════════════════════════════════════════════════════

function checkWin() {
  const c = { blue:0, red:0, green:0, neutral:0 };
  Object.values(T).forEach(t => c[t.owner]++);
  // Troops still on the march keep a side alive until they arrive
  const alive = { blue:c.blue, red:c.red, green:c.green };
  units.forEach(u => { if (!u.dead) alive[u.owner]++; });
  if (alive.blue === 0) { endGame(false, 'Your territories have been conquered!'); return; }
  if (alive.red === 0 && alive.green === 0) {
    endGame(true, c.neutral === 0 ? 'You unified all of India!' : 'All rivals defeated — India is yours!');
  }
}

function endGame(won, msg) {
  running = false;
  cancelAnimationFrame(raf);
  document.getElementById('res-icon').textContent  = won ? '🏆' : '💀';
  document.getElementById('res-title').textContent = won ? 'VICTORY!' : 'DEFEATED';
  document.getElementById('res-title').className   = won ? 'win' : 'lose';
  document.getElementById('res-msg').textContent   = msg;
  document.getElementById('res-scr').style.display = 'flex';
}

// ══════════════════════════════════════════════════════
//  TROOP GENERATION
// ══════════════════════════════════════════════════════

function genTroops(now) {
  if (now - lastTroop < 1000) return;
  lastTroop = now;
  Object.values(T).forEach(t => { if (t.owner !== 'neutral') t.troops += 1; });
  dirty = true;
}

// ══════════════════════════════════════════════════════
//  AI  (no adjacency restriction — attacks best target anywhere)
// ══════════════════════════════════════════════════════

function runAI(now) {
  if (now - lastAI < AI_INTERVAL) return;
  lastAI = now;

  ['red', 'green'].forEach(ai => aiTurn(ai, AI_MAX_SOURCES));
}

function aiTurn(ai, maxSources) {
  // Owned territories with enough troops to attack and no march under way —
  // in random order, so the whole front stays active instead of one big army
  // doing all the work
  const marching = new Set(emitters.map(e => e.from));
  const mine = Object.entries(T)
    .filter(([nm, t]) => t.owner === ai && t.troops > 10 && !marching.has(nm));
  for (let i = mine.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [mine[i], mine[j]] = [mine[j], mine[i]];
  }

  // Troops this AI already has on the way, per target
  const inbound = {};
  units.forEach(u => { if (u.owner === ai) inbound[u.to] = (inbound[u.to] || 0) + 1; });
  emitters.forEach(e => { if (e.owner === ai) inbound[e.to] = (inbound[e.to] || 0) + e.left; });

  const used = new Set();
  for (const [src, sT] of mine) {
    if (used.size >= maxSources) break;
    const send = Math.floor(sT.troops);

    // Score every non-owned territory — weaker and closer = higher score,
    // with a bonus for hitting a rival over a neutral
    let best = null;
    Object.entries(T).forEach(([nm, t]) => {
      if (t.owner === ai) return;
      const secs = flightLen(src, nm) / WORLD_SPEED;
      // Owned states keep growing while our troops are on the march
      const def  = t.troops + (t.owner === 'neutral' ? 0 : secs);
      const need = def - (inbound[nm] || 0);
      if (need < 0) return;          // already being taken
      if (send < need + 2) return;   // don't suicide into a stronger territory
      const sc = (t.owner === 'neutral' ? 40 : 55) - def - secs * 3;
      if (!best || sc > best.sc) best = { name: nm, sc };
    });

    if (!best) continue;
    launch(src, best.name, ai);
    inbound[best.name] = (inbound[best.name] || 0) + send;
    used.add(src);
  }

  // Now and then — and whenever no single state could win a fight — pool the
  // nearest states against a territory too strong for any one of them,
  // preferring the plan that commits the fewest states
  if (used.size && Math.random() > AI_POOL_CHANCE) return;
  const ready = mine.filter(([nm]) => !used.has(nm));
  if (ready.length < 2) return;

  let plan = null;
  Object.entries(T).forEach(([nm, t]) => {
    if (t.owner === ai) return;
    const srcs = ready
      .map(([sn, s]) => ({ name: sn, st: s, secs: flightLen(sn, nm) / WORLD_SPEED }))
      .sort((a, b) => a.secs - b.secs);
    let sum = 0;
    for (let n = 0; n < srcs.length; n++) {
      sum += Math.floor(srcs[n].st.troops);
      const need = t.troops + (t.owner === 'neutral' ? 0 : srcs[n].secs) - (inbound[nm] || 0);
      if (need < 0) return;          // already being taken
      if (sum >= need * 1.15 + 3) {
        if (n === 0) return;         // one state is enough — not a pooling job
        const sc = -(n + 1) * 10 - srcs[n].secs * 3;
        if (!plan || sc > plan.sc) plan = { name: nm, srcs: srcs.slice(0, n + 1), sc };
        return;
      }
    }
  });
  if (!plan) return;
  plan.srcs.forEach(s => launch(s.name, plan.name, ai));
}

// ══════════════════════════════════════════════════════
//  GAME LOOP
// ══════════════════════════════════════════════════════

function loop(ts) {
  if (!running) return;
  const dt = Math.min(ts - lastTs, 60);
  lastTs = ts;
  genTroops(ts); runAI(ts);
  // Small sub-steps so fast-closing columns can't pass through each other
  for (let rem = dt; rem > 0; rem -= 20) {
    const h = Math.min(rem, 20);
    stepEmitters(h); stepUnits(h);
  }
  stepPuffs(dt);
  if (dirty) { dirty = false; renderAll(); updatePB(); checkWin(); }
  drawFx();
  if (running) raf = requestAnimationFrame(loop);
}

// ══════════════════════════════════════════════════════
//  INPUT HELPERS
// ══════════════════════════════════════════════════════

function svgPt(e) {
  // touchend has an empty `touches` list — the lifted finger is in `changedTouches`
  const src  = (e.touches && e.touches.length) ? e.touches[0]
             : (e.changedTouches && e.changedTouches.length) ? e.changedTouches[0] : e;
  const m    = svg.getScreenCTM();
  return {
    x: (src.clientX - m.e) / m.a,
    y: (src.clientY - m.f) / m.d,
    cx: src.clientX, cy: src.clientY
  };
}

function nameAt(pt) {
  const el = document.elementFromPoint(pt.cx, pt.cy);
  if (!el) return null;
  const nm = ID2NAME[el.id];
  return nm && T[nm] ? nm : null;
}

// Territory whose centre circle the point is touching, if any
function nodeAt(pt) {
  let best = null, bestD = NODE_HIT;
  Object.keys(T).forEach(nm => {
    const d = Math.hypot(pt.x - CX[nm][0], pt.y - CX[nm][1]);
    if (d <= bestD) { best = nm; bestD = d; }
  });
  return best;
}

// Draw the aiming arrow from the dragged state's circle out to the pointer —
// exactly as far as it has been dragged, never snapping to anything
function showArrow(pt) {
  const [x1, y1] = CX[dragSrc];
  const tx = pt.x, ty = pt.y;                          // tip
  const len = Math.hypot(tx - x1, ty - y1);
  const HEAD = 11, HALF = 6.5;
  if (len < NODE_R + HEAD) { hideArrow(); return; }
  const ux = (tx - x1) / len, uy = (ty - y1) / len;
  const bx = tx - ux * HEAD,  by = ty - uy * HEAD;     // base of the head
  arrowLine.setAttribute('x1', x1 + ux * NODE_R);
  arrowLine.setAttribute('y1', y1 + uy * NODE_R);
  arrowLine.setAttribute('x2', bx);
  arrowLine.setAttribute('y2', by);
  arrowHead.setAttribute('points',
    tx + ',' + ty + ' ' +
    (bx - uy * HALF) + ',' + (by + ux * HALF) + ' ' +
    (bx + uy * HALF) + ',' + (by - ux * HALF));
  arrowEl.style.display = '';
}

function hideArrow() {
  arrowEl.style.display = 'none';
}

function clearDrag() {
  hideArrow();
  const had = dragSrc || dragTgt;
  dragSrc = dragTgt = null;
  if (had) renderAll();
}

function sendTroops(from, to) {
  if (!from || !to || from === to || !T[to]) return;
  const sT = T[from];
  if (!sT || sT.owner !== 'blue') return;
  if (sT.troops < 1) { flash('No troops to send!'); return; }
  launch(from, to, 'blue');
  renderAll();
}

// ── Drag / tap ────────────────────────────────────────
// Press on a blue state and drag the arrow out; troops are sent only if it is
// released with its tip touching another territory's circle.
// A tap (press + release on the same blue state) selects it instead; the
// next tap on any territory is then the target.

function onDown(e) {
  if (!running) return;
  e.preventDefault();
  const pt = svgPt(e);
  const nm = nameAt(pt);

  if (!nm || T[nm].owner !== 'blue') {
    // Tap on a target (or empty space) while a state is selected
    if (selState) {
      if (nm) sendTroops(selState, nm);
      selState = null;
      renderAll();
    }
    return;
  }

  dragSrc = nm;
  showArrow(pt);
  renderAll();

  hintEl.style.opacity = '0';
}

function onMove(e) {
  if (!dragSrc) return;
  e.preventDefault();
  const pt = svgPt(e);

  // A territory is only targeted while the arrow tip touches its circle
  const over = nodeAt(pt);
  const tgt  = over !== dragSrc ? over : null;
  if (tgt !== dragTgt) { dragTgt = tgt; renderAll(); }
  showArrow(pt);
}

function onUp(e) {
  if (!dragSrc) return;
  e.preventDefault();
  const pt  = svgPt(e);
  const tgt = nodeAt(pt);        // circle the arrow tip is touching
  const src = dragSrc;
  dragSrc = dragTgt = null;
  hideArrow();

  if (running) {
    if (tgt && tgt !== src) {
      sendTroops(src, tgt);
      selState = null;
    } else if (nameAt(pt) === src) {
      // Tap on one of our own states
      if (selState && selState !== src) {
        sendTroops(selState, src);   // reinforce
        selState = null;
      } else {
        selState = selState === src ? null : src;
      }
    }
  }
  renderAll();
}

svg.addEventListener('mousedown',   onDown);
svg.addEventListener('mousemove',   onMove);
svg.addEventListener('mouseup',     onUp);
svg.addEventListener('mouseleave',  clearDrag);
svg.addEventListener('touchstart',  onDown, { passive:false });
svg.addEventListener('touchmove',   onMove, { passive:false });
svg.addEventListener('touchend',    onUp,   { passive:false });
svg.addEventListener('touchcancel', clearDrag);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && selState) { selState = null; renderAll(); }
});

// ── Hint flash ────────────────────────────────────────

let hintTmr = null;
function flash(msg) {
  hintEl.textContent = msg; hintEl.style.opacity = '1';
  clearTimeout(hintTmr);
  hintTmr = setTimeout(() => {
    hintEl.textContent  = 'Drag from your blue state to send all troops';
    hintEl.style.opacity = '0.5';
  }, 2200);
}

// ══════════════════════════════════════════════════════
//  START / RESTART
// ══════════════════════════════════════════════════════

function startGame() {
  document.getElementById('start-scr').style.display = 'none';
  document.getElementById('res-scr').style.display   = 'none';
  hintEl.style.opacity = '0.5';
  hintEl.textContent   = 'Drag from your blue state to send all troops';

  cancelAnimationFrame(raf);
  initGame();
  running = true;
  lastTs = lastTroop = lastAI = performance.now();
  raf = requestAnimationFrame(loop);
}

document.getElementById('start-btn').addEventListener('click',   startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);

// ══════════════════════════════════════════════════════
//  BOOT
// ══════════════════════════════════════════════════════

loadMap();
</script>
